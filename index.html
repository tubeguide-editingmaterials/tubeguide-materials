<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUBEGUIDE HERE</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
    background:#050505;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

button,a{
    -webkit-tap-highlight-color:transparent;
}

#app{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    background:#050505;
}

.page{
    width:100%;
    max-width:864px;
    min-height:100vh;
    position:relative;
    display:none;
}

.page.active{
    display:block;
}

.design-page{
    width:100%;
    position:relative;
}

.design-page > img.background{
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    pointer-events:none;
}

/* =========================
   HOME BUTTONS
========================= */

.home-button{
    position:absolute;
    border:0;
    background:transparent;
    cursor:pointer;
    z-index:10;
}

.home-about{
    left:2.8%;
    top:40.1%;
    width:45.4%;
    height:19.3%;
}

.home-materials{
    left:51.4%;
    top:39.8%;
    width:46.2%;
    height:19.6%;
}

.home-social{
    left:2.1%;
    top:64.1%;
    width:46.2%;
    height:19.7%;
}

.home-review{
    left:51.4%;
    top:64.1%;
    width:46.2%;
    height:19.8%;
}

.home-button:active{
    transform:scale(.98);
}

/* =========================
   BACK BUTTON
========================= */

.back-button{
    position:absolute;
    right:3%;
    top:2.4%;
    width:18%;
    height:3.3%;
    border:0;
    background:transparent;
    cursor:pointer;
    z-index:50;
}

/* =========================
   SOCIAL BUTTONS
========================= */

.social-button{
    position:absolute;
    left:13%;
    width:74%;
    border:0;
    background:transparent;
    cursor:pointer;
    z-index:20;
}

.social-youtube{
    top:20.3%;
    height:10.5%;
}

.social-instagram{
    top:36.0%;
    height:10.5%;
}

.social-facebook{
    top:51.8%;
    height:10.5%;
}

.social-twitter{
    top:67.7%;
    height:10.5%;
}

/* =========================
   MATERIALS PAGE
========================= */

.materials-page{
    background:#272727;
    min-height:100vh;
    color:white;
    padding-bottom:50px;
}

.materials-header{
    position:relative;
}

.materials-design{
    width:100%;
    display:block;
}

.material-area{
    position:absolute;
    left:7.5%;
    width:85%;
    z-index:10;
}

.png-area{
    top:16.1%;
    height:33.8%;
}

.xml-area{
    top:60.5%;
    height:31.8%;
}

.material-grid{
    position:absolute;
    left:3.2%;
    right:3.2%;
    top:5%;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5.5%;
}

.material-card{
    position:relative;
    width:100%;
    aspect-ratio:0.67;
    border-radius:22px;
    overflow:hidden;
    background:#e5e5e5;
    border:3px solid white;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
    display:flex;
    align-items:center;
    justify-content:center;
}

.material-card img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

.material-card a{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:white;
}

.xml-card{
    aspect-ratio:0.78;
    border-radius:16px;
}

.xml-icon{
    width:58%;
    height:68%;
    background:#f1f1f1;
    clip-path:polygon(
        0 0,
        65% 0,
        100% 30%,
        100% 100%,
        0 100%
    );
    display:flex;
    align-items:center;
    justify-content:center;
}

.xml-icon span{
    color:#555;
    font-size:clamp(15px,4vw,34px);
    font-weight:900;
}

.see-more{
    position:absolute;
    left:10%;
    bottom:2%;
    width:80%;
    height:17%;
    border:0;
    background:transparent;
    color:transparent;
    cursor:pointer;
    z-index:30;
}

.see-more:active{
    transform:scale(.98);
}

.more-materials{
    display:none;
    margin-top:25px;
    padding:20px 7%;
}

.more-materials.show{
    display:block;
}

.more-title{
    color:white;
    font-size:28px;
    font-weight:900;
    text-align:center;
    margin-bottom:20px;
}

.more-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.more-card{
    background:#ddd;
    border:2px solid white;
    border-radius:15px;
    min-height:150px;
    overflow:hidden;
}

.more-card img{
    width:100%;
    height:100%;
    min-height:150px;
    object-fit:contain;
    display:block;
}

.more-card a{
    display:block;
    width:100%;
    height:100%;
}

.empty-message{
    color:white;
    text-align:center;
    font-size:18px;
    padding:25px;
}

/* =========================
   REVIEW PAGE
========================= */

.review-page{
    min-height:100vh;
    background:#111;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
}

.review-box{
    width:90%;
    max-width:600px;
    border:2px solid white;
    border-radius:25px;
    padding:40px 25px;
    background:#222;
}

.review-box h1{
    color:#ffd83d;
    margin-bottom:20px;
}

.review-box p{
    font-size:18px;
    line-height:1.6;
}

.review-back{
    position:fixed;
    top:20px;
    right:20px;
    padding:10px 22px;
    border-radius:30px;
    border:0;
    font-weight:bold;
    cursor:pointer;
}

/* =========================
   LOADING
========================= */

.loading{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:18px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .material-card{
        border-radius:14px;
        border-width:2px;
    }

    .more-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .more-card{
        min-height:120px;
    }

    .more-card img{
        min-height:120px;
    }
}

@media(min-width:865px){

    .page{
        box-shadow:0 0 40px rgba(0,0,0,.5);
    }
}/* MOBILE FULL SCREEN + RESPONSIVE FIX */

html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
}

#app {
    width: 100vw;
    min-height: 100vh;
    margin: 0;
    padding: 0;
    display: block;
}

.page {
    width: 100vw !important;
    max-width: none !important;
    min-height: 100vh;
    margin: 0;
    padding: 0;
}

.page.active {
    width: 100vw;
}

.design-page {
    width: 100vw !important;
    max-width: none !important;
    margin: 0;
    padding: 0;
}

.design-page > img.background {
    display: block;
    width: 100vw !important;
    max-width: 100vw !important;
    height: auto !important;
    margin: 0;
    padding: 0;
}

/* Smooth page animation */

.page.active {
    animation: pageFade 0.45s ease;
}

@keyframes pageFade {
    from {
        opacity: 0;
        transform: scale(0.98);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* Smooth button touch */

.home-button,
button,
a {
    transition: transform 0.2s ease, opacity 0.2s ease;
}

.home-button:active,
button:active,
a:active {
    transform: scale(0.96);
}/* HOME PAGE - FULL SCREEN */
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

#app {
    width: 100vw;
    height: 100vh;
    min-height: 100vh;
    margin: 0;
    padding: 0;
}

#homePage {
    width: 100vw !important;
    height: 100vh !important;
    min-height: 100vh !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden;
}

#homePage .design-page {
    width: 100vw !important;
    height: 100vh !important;
    margin: 0 !important;
    padding: 0 !important;
}

#homePage .background {
    width: 100vw !important;
    height: 100vh !important;
    object-fit: fill !important;
    display: block;
}/* EXTRA BACK BUTTON HIDE
   Original BACK button is already inside design images */
.back-btn,
.back-button,
button.back,
.back {
    display: none !important;
}
</style>
</head>

<body>

<div id="app">

<!-- ==================================================
     HOME PAGE
================================================== -->

<section id="homePage" class="page active">

    <div class="design-page">

        <img
            class="background"
            src="home.png"
            alt="TUBEGUIDE Home"
        >

        <!-- ABOUT ME -->
        <button
            class="home-button home-about"
            onclick="showPage('aboutPage')"
            aria-label="About Me">
        </button>

        <!-- EDITING MATERIAL -->
        <button
            class="home-button home-materials"
            onclick="showPage('materialsPage'); loadMaterials()"
            aria-label="Editing Material">
        </button>

        <!-- SOCIAL MEDIA -->
        <button
            class="home-button home-social"
            onclick="showPage('socialPage')"
            aria-label="Social Media">
        </button>

        <!-- CHANNEL REVIEW PRICE -->
        <button
            class="home-button home-review"
            onclick="showPage('reviewPage')"
            aria-label="Channel Review Price">
        </button>

    </div>

</section>


<!-- ==================================================
     ABOUT ME PAGE
================================================== -->

<section id="aboutPage" class="page">

    <div class="design-page">

        <img
            class="background"
            src="about.png"
            alt="About Me"
        >

        <button
            class="back-button"
            onclick="showPage('homePage')"
            aria-label="Back">
        </button>

    </div>

</section>


<!-- ==================================================
     SOCIAL MEDIA PAGE
================================================== -->

<section id="socialPage" class="page">

    <div class="design-page">

        <img
            class="background"
            src="social.png"
            alt="Social Media"
        >

        <!-- BACK -->
        <button
            class="back-button"
            onclick="showPage('homePage')"
            aria-label="Back">
        </button>

        <!-- YOUTUBE -->
        <button
            class="social-button social-youtube"
            onclick="openSocial('youtube')"
            aria-label="YouTube">
        </button>

        <!-- INSTAGRAM -->
        <button
            class="social-button social-instagram"
            onclick="openSocial('instagram')"
            aria-label="Instagram">
        </button>

        <!-- FACEBOOK -->
        <button
            class="social-button social-facebook"
            onclick="openSocial('facebook')"
            aria-label="Facebook">
        </button>

        <!-- TWITTER / X -->
        <button
            class="social-button social-twitter"
            onclick="openSocial('twitter')"
            aria-label="Twitter">
        </button>

    </div>

</section>


<!-- ==================================================
     EDITING MATERIAL PAGE
================================================== -->

<section id="materialsPage" class="page materials-page">

    <div class="materials-header">

        <img
            class="materials-design"
            src="materials.png"
            alt="Editing Materials"
        >

        <!-- BACK -->
        <button
            class="back-button"
            onclick="showPage('homePage')"
            aria-label="Back">
        </button>


        <!-- PNG -->

        <div class="material-area png-area">

            <div
                id="pngGrid"
                class="material-grid">

                <div class="loading">
                    Loading PNG...
                </div>

            </div>

            <button
                id="pngMoreButton"
                class="see-more"
                onclick="showMore('png')"
                aria-label="See More PNG">
            </button>

        </div>


        <!-- XML -->

        <div class="material-area xml-area">

            <div
                id="xmlGrid"
                class="material-grid">

                <div class="loading">
                    Loading XML...
                </div>

            </div>

            <button
                id="xmlMoreButton"
                class="see-more"
                onclick="showMore('xml')"
                aria-label="See More XML">
            </button>

        </div>

    </div>


    <!-- MORE PNG -->

    <div
        id="morePng"
        class="more-materials">

        <div class="more-title">
            ALL PNG MATERIALS
        </div>

        <div
            id="allPngGrid"
            class="more-grid">
        </div>

    </div>


    <!-- MORE XML -->

    <div
        id="moreXml"
        class="more-materials">

        <div class="more-title">
            ALL XML MATERIALS
        </div>

        <div
            id="allXmlGrid"
            class="more-grid">
        </div>

    </div>

</section>


<!-- ==================================================
     CHANNEL REVIEW PRICE
================================================== -->

<section id="reviewPage" class="page review-page">

    <button
        class="review-back"
        onclick="showPage('homePage')">
        BACK
    </button>

    <div class="review-box">

        <h1>CHANNEL REVIEW PRICE</h1>

        <p>
            Channel Review service will be available here.
        </p>

        <p style="margin-top:15px;">
            Payment system will be added later.
        </p>

    </div>

</section>

</div>


<script>

/* ======================================================
   GITHUB SETTINGS
====================================================== */

const GITHUB_OWNER = "tubeguide-editingmaterials";

const GITHUB_REPO = "tubeguide-materials";

const GITHUB_BRANCH = "main";


/* ======================================================
   SOCIAL MEDIA LINKS
====================================================== */

const SOCIAL_LINKS = {

    youtube:
        "https://youtube.com/@yt-tubeguide",

    instagram:
        "https://www.instagram.com/ig_tubeguide/",

    facebook:
        "https://www.facebook.com/",

    twitter:
        "https://x.com/"

};


/* ======================================================
   PAGE NAVIGATION
====================================================== */

function showPage(pageId){

    const pages =
        document.querySelectorAll(".page");

    pages.forEach(function(page){

        page.classList.remove("active");

    });

    const selectedPage =
        document.getElementById(pageId);

    if(selectedPage){

        selectedPage.classList.add("active");

        window.scrollTo({
            top:0,
            behavior:"instant"
        });

    }

}


/* ======================================================
   SOCIAL MEDIA OPEN
====================================================== */

function openSocial(platform){

    const url =
        SOCIAL_LINKS[platform];

    if(!url){

        alert(
            "Social media link is not added yet."
        );

        return;
    }

    window.open(
        url,
        "_blank"
    );

}


/* ======================================================
   GITHUB MATERIAL SYSTEM
====================================================== */

let allPNG = [];

let allXML = [];

let materialsLoaded = false;


/* Design images ko material list me nahi dikhana */

const DESIGN_FILES = [

    "home.png",
    "about.png",
    "materials.png",
    "social.png"

];


/* ======================================================
   LOAD MATERIALS
====================================================== */

async function loadMaterials(){

    if(materialsLoaded){

        return;

    }

    const pngGrid =
        document.getElementById("pngGrid");

    const xmlGrid =
        document.getElementById("xmlGrid");

    try{

        const apiURL =
            `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`;

        const response =
            await fetch(apiURL);

        if(!response.ok){

            throw new Error(
                "GitHub files could not be loaded."
            );

        }

        const data =
            await response.json();

        if(!data.tree){

            throw new Error(
                "No files found."
            );

        }

        const files =
            data.tree.filter(function(item){

                return item.type === "blob";

            });


        /* PNG */

        allPNG =
            files.filter(function(file){

                const name =
                    file.path
                    .split("/")
                    .pop()
                    .toLowerCase();

                return (
                    name.endsWith(".png")
                    &&
                    !DESIGN_FILES
                    .map(x => x.toLowerCase())
                    .includes(name)
                );

            });


        /* XML */

        allXML =
            files.filter(function(file){

                const name =
                    file.path
                    .split("/")
                    .pop()
                    .toLowerCase();

                return name.endsWith(".xml");

            });


        renderInitialPNG();

        renderInitialXML();

        renderAllPNG();

        renderAllXML();

        materialsLoaded = true;

    }
    catch(error){

        console.error(error);

        pngGrid.innerHTML = `
            <div class="empty-message">
                PNG materials could not be loaded.
            </div>
        `;

        xmlGrid.innerHTML = `
            <div class="empty-message">
                XML materials could not be loaded.
            </div>
        `;

    }

}


/* ======================================================
   RAW GITHUB URL
====================================================== */

function rawURL(path){

    return `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${path
        .split("/")
        .map(encodeURIComponent)
        .join("/")}`;

}


/* ======================================================
   INITIAL PNG
====================================================== */

function renderInitialPNG(){

    const grid =
        document.getElementById("pngGrid");

    grid.innerHTML = "";

    const firstThree =
        allPNG.slice(0,3);

    if(firstThree.length === 0){

        grid.innerHTML = `
            <div class="empty-message">
                No PNG materials uploaded yet.
            </div>
        `;

        return;

    }

    firstThree.forEach(function(file){

        const url =
            rawURL(file.path);

        const card =
            document.createElement("div");

        card.className =
            "material-card";

        card.innerHTML = `
            <a
                href="${url}"
                target="_blank"
                rel="noopener">

                <img
                    src="${url}"
                    alt="${escapeHTML(file.path)}"
                    loading="lazy">

            </a>
        `;

        grid.appendChild(card);

    });

}


/* ======================================================
   INITIAL XML
====================================================== */

function renderInitialXML(){

    const grid =
        document.getElementById("xmlGrid");

    grid.innerHTML = "";

    const firstThree =
        allXML.slice(0,3);

    if(firstThree.length === 0){

        grid.innerHTML = `
            <div class="empty-message">
                No XML materials uploaded yet.
            </div>
        `;

        return;

    }

    firstThree.forEach(function(file){

        const url =
            rawURL(file.path);

        const card =
            document.createElement("div");

        card.className =
            "material-card xml-card";

        card.innerHTML = `
            <a
                href="${url}"
                target="_blank"
                rel="noopener">

                <div class="xml-icon">
                    <span>XML</span>
                </div>

            </a>
        `;

        grid.appendChild(card);

    });

}


/* ======================================================
   ALL PNG
====================================================== */

function renderAllPNG(){

    const grid =
        document.getElementById("allPngGrid");

    grid.innerHTML = "";

    allPNG.forEach(function(file){

        const url =
            rawURL(file.path);

        const card =
            document.createElement("div");

        card.className =
            "more-card";

        card.innerHTML = `
            <a
                href="${url}"
                target="_blank"
                rel="noopener">

                <img
                    src="${url}"
                    alt="${escapeHTML(file.path)}"
                    loading="lazy">

            </a>
        `;

        grid.appendChild(card);

    });

}


/* ======================================================
   ALL XML
====================================================== */

function renderAllXML(){

    const grid =
        document.getElementById("allXmlGrid");

    grid.innerHTML = "";

    allXML.forEach(function(file){

        const url =
            rawURL(file.path);

        const card =
            document.createElement("div");

        card.className =
            "more-card";

        card.innerHTML = `
            <a
                href="${url}"
                target="_blank"
                rel="noopener">

                <div
                    class="xml-icon"
                    style="
                        width:70%;
                        height:70%;
                        margin:15% auto;
                    ">

                    <span>XML</span>

                </div>

            </a>
        `;

        grid.appendChild(card);

    });

}


/* ======================================================
   SEE MORE
====================================================== */

function showMore(type){

    if(type === "png"){

        const section =
            document.getElementById("morePng");

        section.classList.toggle("show");

        if(section.classList.contains("show")){

            section.scrollIntoView({
                behavior:"smooth",
                block:"start"
            });

        }

    }


    if(type === "xml"){

        const section =
            document.getElementById("moreXml");

        section.classList.toggle("show");

        if(section.classList.contains("show")){

            section.scrollIntoView({
                behavior:"smooth",
                block:"start"
            });

        }

    }

}


/* ======================================================
   HTML ESCAPE
====================================================== */

function escapeHTML(text){

    return String(text)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* ======================================================
   START HOME
====================================================== */

showPage("homePage");

</script>

</body>
</html>
